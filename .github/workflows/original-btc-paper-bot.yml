name: Original BTC Paper Bot

on:
  push:
    paths:
      - "btc_poly_bot_v2.py"
      - ".github/workflows/original-btc-paper-bot.yml"
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-btc-paper-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore original BTC paper journal
        uses: actions/cache/restore@v4
        with:
          path: data/btc_poly_v2.sqlite3
          key: original-btc-paper-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            original-btc-paper-${{ github.ref_name }}-

      - name: Restore shared learning journal
        uses: actions/cache/restore@v4
        with:
          path: data/shared_learning.json
          key: signalforge-shared-learning-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            signalforge-shared-learning-${{ github.ref_name }}-

      - name: Validate Python syntax
        run: python -m py_compile btc_poly_bot_v2.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify original BTC Discord destination
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BTC_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not url:
              print("BTC Discord destination check: webhook secret is missing")
              raise SystemExit(0)
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  data = json.load(response)
              print("BTC Discord webhook destination: channel_name=%s channel_id=%s webhook_name=%s" % (
                  data.get("channel_name", "unknown"), data.get("channel_id", "unknown"),
                  data.get("name", "unknown")))
          except urllib.error.HTTPError as error:
              print("BTC Discord destination check failed: HTTP %s" % error.code)
          except Exception as error:
              print("BTC Discord destination check failed: %s" % type(error).__name__)
          PY

      - name: Verify original BTC live dashboard destination
        env:
          DISCORD_BTC_LIVE_WEBHOOK_URL: ${{ secrets.DISCORD_BTC_LIVE_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ.get("DISCORD_BTC_LIVE_WEBHOOK_URL", "").strip()
          if not url:
              print("BTC live dashboard check failed: GitHub Actions secret DISCORD_BTC_LIVE_WEBHOOK_URL is missing")
              raise SystemExit(1)
          if not (url.startswith("https://discord.com/api/webhooks/") or
                  url.startswith("https://discordapp.com/api/webhooks/")):
              print("BTC live dashboard check failed: secret is not a Discord webhook URL")
              raise SystemExit(1)
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  data = json.load(response)
              print("BTC live dashboard destination: channel_name=%s channel_id=%s webhook_name=%s" % (
                  data.get("channel_name", "unknown"), data.get("channel_id", "unknown"),
                  data.get("name", "unknown")))
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print("BTC live dashboard check failed: HTTP %s" % error.code)
              print("Discord response: %s" % body[:500])
              raise SystemExit(1)
          except Exception as error:
              print("BTC live dashboard check failed: %s: %s" % (type(error).__name__, error))
              raise SystemExit(1)
          PY

      - name: Run original BTC paper bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BTC_WEBHOOK_URL }}
          DISCORD_BTC_LIVE_WEBHOOK_URL: ${{ secrets.DISCORD_BTC_LIVE_WEBHOOK_URL }}
          BTC_BOT_DB: data/btc_poly_v2.sqlite3
        run: |
          mkdir -p data
          python btc_poly_bot_v2.py --duration 240

      - name: Publish original BTC dashboard snapshot
        if: always()
        run: |
          if [ -f docs/data_btc.json ]; then
            cp docs/data_btc.json /tmp/data_btc_snapshot.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/data_btc_snapshot.json docs/data_btc.json
              git add docs/data_btc.json
              if git diff --cached --quiet; then
                echo "BTC dashboard snapshot is unchanged."
                exit 0
              fi
              git commit -m "Refresh original BTC dashboard data"
              if git push origin HEAD:main; then
                echo "BTC dashboard snapshot published."
                exit 0
              fi
              echo "Dashboard push conflicted; retrying ($attempt/5)."
              git reset --hard origin/main
              sleep 2
            done
            echo "::warning::BTC dashboard snapshot could not be published after retries; paper scan data remains saved in cache."
          fi

      - name: Save shared learning journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/shared_learning.json
          key: signalforge-shared-learning-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save original BTC paper journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/btc_poly_v2.sqlite3
          key: original-btc-paper-${{ github.ref_name }}-${{ github.run_id }}

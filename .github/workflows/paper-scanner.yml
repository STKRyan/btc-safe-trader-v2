name: Multi-Asset Paper Scanner

on:
  push:
    branches: [main]
    paths:
      - poly_multi_asset_bot.py
      - .github/workflows/paper-scanner.yml
  schedule:
    # Start a four-minute scan every five minutes for fresher signals.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-asset-paper-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore paper journal
        uses: actions/cache/restore@v4
        with:
          path: data
          key: paper-journal-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            paper-journal-${{ github.ref_name }}-

      - name: Restore shared learning journal
        uses: actions/cache/restore@v4
        with:
          path: data/shared_learning.json
          key: signalforge-shared-learning-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            signalforge-shared-learning-${{ github.ref_name }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile poly_multi_asset_bot.py

      - name: Verify multi-asset Discord destination safely
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MULTI_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not url:
              print("Multi-asset Discord destination check: webhook secret is missing")
              raise SystemExit(0)
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  data = json.load(response)
              print("Multi-asset Discord destination: channel_name=%s channel_id=%s webhook_name=%s" % (
                  data.get("channel_name", "unknown"), data.get("channel_id", "unknown"),
                  data.get("name", "unknown")))
          except urllib.error.HTTPError as error:
              print("Multi-asset Discord destination check failed: HTTP %s" % error.code)
          except Exception as error:
              print("Multi-asset Discord destination check failed: %s" % type(error).__name__)
          PY

      - name: Run paper-only scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MULTI_WEBHOOK_URL }}
          POLY_BOT_DB: data/poly_multi_asset.sqlite3
          SCAN_INTERVAL_SECONDS: "5"
          PAPER_STAKE_USD: "2"
          DAILY_LOSS_LIMIT_USD: "8"
          MAX_OPEN_PAPER_TRADES: "4"
          MIN_BOOK_DEPTH_USD: "500"
          MAX_SPREAD: "0.035"
        run: |
          mkdir -p data
          python poly_multi_asset_bot.py --duration 240

      - name: Save shared learning journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/shared_learning.json
          key: signalforge-shared-learning-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish dashboard snapshot
        if: always()
        run: |
          if [ -f docs/data.json ]; then
            cp docs/data.json "$RUNNER_TEMP/paper-dashboard-data.json"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Start each publish attempt from the latest main. This avoids
            # rebasing conflicting generated JSON from overlapping bot runs.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              cp "$RUNNER_TEMP/paper-dashboard-data.json" docs/data.json
              git add docs/data.json

              if git diff --cached --quiet; then
                echo "Dashboard data is already current."
                exit 0
              fi

              git commit -m "Refresh paper dashboard data"
              if git push origin HEAD:main; then
                echo "Dashboard snapshot published."
                exit 0
              fi

              echo "Push raced with another workflow; retrying from latest main (attempt $attempt)."
            done

            echo "Could not publish dashboard snapshot after 3 attempts."
            exit 1
          fi

      - name: Save paper journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: paper-journal-${{ github.ref_name }}-${{ github.run_id }}

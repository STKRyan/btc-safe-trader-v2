name: Multi-Asset Paper Scanner

on:
  schedule:
    # Conservative cadence for GitHub Actions Free usage.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-asset-paper-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore paper journal
        uses: actions/cache/restore@v4
        with:
          path: data
          key: paper-journal-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            paper-journal-${{ github.ref_name }}-

      - name: Restore shared learning journal
        uses: actions/cache/restore@v4
        with:
          path: data/shared_learning.json
          key: signalforge-shared-learning-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            signalforge-shared-learning-${{ github.ref_name }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile poly_multi_asset_bot.py

      - name: Run paper-only scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MULTI_WEBHOOK_URL }}
          POLY_BOT_DB: data/poly_multi_asset.sqlite3
          SCAN_INTERVAL_SECONDS: "15"
          PAPER_STAKE_USD: "2"
          DAILY_LOSS_LIMIT_USD: "8"
          MAX_OPEN_PAPER_TRADES: "4"
          MIN_BOOK_DEPTH_USD: "500"
          MAX_SPREAD: "0.035"
        run: |
          mkdir -p data
          python poly_multi_asset_bot.py --duration 600

      - name: Save shared learning journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/shared_learning.json
          key: signalforge-shared-learning-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish dashboard snapshot
        if: always()
        run: |
          if [ -f docs/data.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh paper dashboard data"
              git pull --rebase origin main
              git push
            fi
          fi
      - name: Save paper journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: paper-journal-${{ github.ref_name }}-${{ github.run_id }}

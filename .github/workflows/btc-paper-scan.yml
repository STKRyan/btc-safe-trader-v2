





name: BTC Polymarket Paper Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-paper-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        
      - name: Diagnose repository files
        run: |
          echo "CURRENT DIRECTORY:"
          pwd
          echo "CHECKED OUT COMMIT:"
          git rev-parse --short HEAD
          echo "PYTHON FILES:"
          find . -maxdepth 4 -type f -iname "*.py" -print
          echo "ROOT FILES:"
          ls -la


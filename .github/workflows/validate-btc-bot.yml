name: Validate BTC bot code

on:
  push:
    branches: [main]
    paths:
      - poly_multi_asset_bot.py
      - live_market_tape.py
      - requirements.txt
      - render.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate BTC bot Python syntax
        run: python -m py_compile poly_multi_asset_bot.py live_market_tape.py

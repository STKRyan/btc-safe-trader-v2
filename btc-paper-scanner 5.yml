name: Multi-Asset Polymarket Paper Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-asset-paper-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-asset paper scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLY_BOT_DB: poly_multi_asset.sqlite3
          SCAN_INTERVAL_SECONDS: "15"
          PAPER_STAKE_USD: "2"
          DAILY_LOSS_LIMIT_USD: "8"
          MAX_OPEN_PAPER_TRADES: "4"
        run: |
          echo "Repository root: $(pwd)"
          if [ ! -f "poly_multi_asset_bot.py" ]; then
            echo "ERROR: poly_multi_asset_bot.py was not found in the repository root."
            echo "Python files present:"
            find . -maxdepth 4 -type f -iname "*.py" -print
            exit 2
          fi
          echo "Running multi-asset scanner in paper-only mode."
          python poly_multi_asset_bot.py --duration 180

      - name: Save multi-asset paper database
        if: always()
        run: |
          if [ -f poly_multi_asset.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"

            git add poly_multi_asset.sqlite3

            if ! git diff --cached --quiet; then
              git commit -m "Update multi-asset paper trading results"

              # Refresh the branch without merging SQLite database files.
              git fetch origin main
              git reset origin/main
              git add poly_multi_asset.sqlite3

              if ! git diff --cached --quiet; then
                git commit -m "Save multi-asset paper trading database"
                git push origin HEAD:main
              fi
            fi
          else
            echo "No multi-asset database was created; nothing to save."
          fi

services:
  - type: worker
    name: btc-safe-trader-v2
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python btc_poly_bot_v2.py
    disk:
      name: btc-paper-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: BTC_BOT_DB
        value: /opt/render/project/src/data/btc_poly_v2.sqlite3
      - key: DISCORD_WEBHOOK_URL
        sync: false

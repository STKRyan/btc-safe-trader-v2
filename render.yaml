services:
  - type: worker
    name: btc-safe-trader-v2
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python btc_poly_bot_v2.py
    disk:
      name: btc-paper-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: BTC_BOT_DB
        value: /opt/render/project/src/data/btc_poly_v2.sqlite3
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_BTC_LIVE_WEBHOOK_URL
        sync: false
      - key: DISCORD_BTC_CHART_WEBHOOK_URL
        sync: false

  - type: worker
    name: btc-chart-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python btc_chart_agent.py
    disk:
      name: btc-chart-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: BTC_CHART_STATE_PATH
        value: /opt/render/project/src/data/btc_chart_state.json
      - key: BTC_CHART_UPDATE_SECONDS
        value: "15"
      - key: DISCORD_BTC_CHART_WEBHOOK_URL
        sync: false

  - type: worker
    name: multi-asset-paper-scanner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python poly_multi_asset_bot.py
    disk:
      name: multi-asset-paper-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: POLY_BOT_DB
        value: /opt/render/project/src/data/poly_multi_asset.sqlite3
      - key: SCAN_INTERVAL_SECONDS
        value: "2"
      - key: SIGNAL_REPEAT_SECONDS
        value: "30"
      - key: DISCORD_WEBHOOK_URL
        sync: false
